[package]
name = "server"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.3.4"
sha2 = "0.10.9"
url = "2.5.8"
base64 = "0.22.1"
serde_urlencoded = "0.7.1"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui"] }
web-push = { version = "0.11.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
store = { path = "../store" }
futures-util = "0.3"
tokio-util = "0.7"

[dev-dependencies]
tungstenite = "0.29.0"
