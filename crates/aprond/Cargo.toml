[package]
name = "aprond"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
turso = "0.8.3"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"

async-trait = "0.1"
futures-util = "0.3"
tokio-util = "0.7"